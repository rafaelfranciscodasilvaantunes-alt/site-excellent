<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página não encontrada | Excellent Soluções</title>
  <style>
    :root { color-scheme: dark; --gold: #d4a94f; --ink: #080808; --paper: #f4f0e7; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 80% 20%, rgba(212, 169, 79, .16), transparent 32rem),
        linear-gradient(135deg, #050505, #161616);
      color: var(--paper);
      font-family: Arial, Helvetica, sans-serif;
    }
    main { width: min(680px, 100%); }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 56px;
      color: var(--paper);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .brand::before { content: ""; width: 42px; height: 3px; background: var(--gold); }
    .code { margin: 0 0 10px; color: var(--gold); font-size: .84rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; max-width: 620px; font-size: clamp(2.7rem, 9vw, 5.8rem); line-height: .98; letter-spacing: -.055em; }
    p { max-width: 540px; margin: 28px 0 34px; color: #c9c5bc; font-size: 1.08rem; line-height: 1.7; }
    a {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      border: 1px solid var(--gold);
      background: var(--gold);
      color: var(--ink);
      font-weight: 700;
      text-decoration: none;
      transition: transform .2s ease, background .2s ease;
    }
    a:hover { transform: translateY(-2px); background: #e2ba68; }
    a:focus-visible { outline: 3px solid var(--paper); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Excellent Soluções</div>
    <p class="code">Erro 404</p>
    <h1>Página não encontrada.</h1>
    <p>O endereço pode ter mudado ou não estar mais disponível. Volte ao início para conhecer as soluções da Excellent.</p>
    <a href="https://www.excellentsolucoes.com.br/">Voltar para o site</a>
  </main>
</body>
</html>
